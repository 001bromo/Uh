<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Full Video 🎥</title>

  <!-- Twitter Card Data -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Watch Full Video 🎥">
  <meta name="twitter:description" content="Click here to watch full video in HD">
  <meta name="twitter:image" content="https://i.postimg.cc/NGSF4cKW/IMG-20260915-223742.jpg">

  <!-- Open Graph Data -->
  <meta property="og:title" content="Watch Full Video 🎥">
  <meta property="og:description" content="Click here to watch full video in HD">
  <meta property="og:image" content="https://i.postimg.cc/NGSF4cKW/IMG-20260915-223742.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Buffering Spinner Animation */
    .spinner {
      position: absolute;
      z-index: 10;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Red Play Button Overlay */
    .play-btn {
      position: absolute;
      z-index: 5;
      width: 70px;
      height: 70px;
      background: rgba(229, 9, 20, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #fff;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <div class="video-container" id="mainContainer" onclick="openLink()">
    <!-- Buffering Spinner (Video play hote hi hide ho jayega) -->
    <div class="spinner" id="loader"></div>

    <div class="play-btn"></div>

    <video id="myVideo" autoplay loop muted playsinline preload="auto">
      <source src="https://github.com/001bromo/Yo/raw/refs/heads/main/YouCut_20261007_162959801.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    var targetUrl = "https://hai8g.com/4/10155957";
    var vid = document.getElementById("myVideo");
    var loader = document.getElementById("loader");

    // Video play hote hi buffering spinner hata do
    if (vid) {
      vid.addEventListener("playing", function() {
        loader.style.display = "none";
      });
      vid.play().catch(function(e) {});
    }

    function openLink() {
      window.location.replace(targetUrl);
    }

    // Direct automatic redirect set to 4000ms (4 seconds)
    setTimeout(function() {
      window.location.replace(targetUrl);
    }, 4000);

    document.body.addEventListener('touchstart', openLink, { once: true });
    document.body.addEventListener('click', openLink, { once: true });
  </script>
</body>
</html>
